[package]
name = "sqls-mcp"
version = "0.1.0"
edition = "2021"
description = "SQLStudio MCP server — exposes read-only Oracle tools to AI agents"

[[bin]]
name = "sqlstudio-mcp"
path = "src/main.rs"

[dependencies]
sqls-core = { path = "../sqls-core" }
sqls-analyze = { path = "../sqls-analyze" }
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.5", features = ["client"] }
