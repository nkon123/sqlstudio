name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri Linux 의존성
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 프런트엔드
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build
      - name: Rust 테스트 (DB 없이)
        run: cargo test --workspace

  oracle-11g:
    # 실제 Oracle 11g XE 에 붙는 통합 테스트
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-xe:11-slim
        env:
          ORACLE_PASSWORD: oracle
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Instant Client 19
        run: |
          sudo apt-get update && sudo apt-get install -y libaio1t64 || sudo apt-get install -y libaio1
          curl -sSL -o ic.zip https://download.oracle.com/otn_software/linux/instantclient/1925000/instantclient-basiclite-linux.x64-19.25.0.0.0dbru.zip
          unzip -q ic.zip -d $HOME
          ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 $HOME/instantclient_19_25/libaio.so.1 || true
          echo "LD_LIBRARY_PATH=$HOME/instantclient_19_25" >> $GITHUB_ENV
      - name: 통합 테스트
        env:
          SQLS_TEST_DSN: system/oracle@localhost:1521/XE
        run: cargo test -p sqls-core -p sqls-mcp -p sqls-analyze -- --ignored --test-threads=1

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: MCP 서버·분석 CLI (설치 파일에 함께 넣는다)
        run: cargo build --release -p sqls-mcp -p sqls-analyze
      - name: 앱 + 설치 파일
        working-directory: app
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: sqlstudio-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/sqlstudio-mcp.exe
            target/release/sqlstudio-analyze.exe
          if-no-files-found: error
