[package]
name = "sqls-core"
version = "0.1.0"
edition = "2021"
description = "SQLStudio core — Oracle session worker, SQL analysis, dictionary queries"

[dependencies]
oracle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
toml = "0.8"
tracing = "0.1"
dirs = "6"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
