[package]
name = "sqlstudio"
version = "0.5.68"
edition = "2021"
description = "SQLStudio desktop app"

[lib]
name = "sqlstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sqls-core = { path = "../../crates/sqls-core" }
sqls-llm = { path = "../../crates/sqls-llm" }
sqls-analyze = { path = "../../crates/sqls-analyze" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# 실행 이력 찾기 — 큰 이력 파일에서 낱말 첫 글자 위치를 빠르게 (이미 다른 의존성이 쓰는 것)
memchr = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "process", "io-util"] }
toml = "0.8"
encoding_rs = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_xlsxwriter = "0.99.1"
calamine = "0.36.1"
csv = "1.4.0"
tauri-plugin-single-instance = "2"
